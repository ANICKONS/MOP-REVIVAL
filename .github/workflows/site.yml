# Publishes the compatibility website of MOPR (site/web) to GitHub Pages.
# The data is built from site/compat/mods.json and MOPR5/mod/Rules by site/build-site.ps1; the build fails (and nothing
# is published) when a rule file has no entry in the list or an entry is wrong.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Compatibility site

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'MOPR5/mod/Rules/**'
      - 'MOPR5/mod/Properties/AssemblyInfo.cs'
      - 'MOPR5/docs/images/icon.png'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the data
        shell: pwsh
        run: ./site/build-site.ps1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
